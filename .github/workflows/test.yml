name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The tests need no model, no sandbox and no network: a scripted agent and a canned referee.
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
